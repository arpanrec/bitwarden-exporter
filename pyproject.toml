[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bitwarden_exporter.*"]
follow_untyped_imports = true

[tool.pylint."MESSAGES CONTROL"]
disable = "invalid-name,missing-module-docstring,raise-missing-from"

[tool.pylint."FORMAT"]
max-line-length = 120
indent-string = "    "

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[project]
name = "bitwarden-exporter"
version = "1.10.5"
description = "Export Bitwarden vault"
authors = [{ name = "arpan", email = "me@arpanrec.com" }]
license-files = ["LICENSE"]
readme = "README.md"
repository = "https://github.com/arpanrec/bitwarden-exporter.git"
documentation = "https://bitwarden-exporter.arpanrec.com/"
homepage = "https://github.com/arpanrec/bitwarden-exporter"
package-mode = true
keywords = ["bitwarden", "export", "keepass", "backup"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "pydantic==2.14.4",
    "pykeepass==4.2.0",
    "jmespath==1.1.0",
    "typer==0.29.1",
]

[project.scripts]
bitwarden-exporter = "bitwarden_exporter.__main__:main"

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
    "mypy==2.4.1",
    "neovim==0.3.1",
    "pylint==4.1.4",
    "pyright==1.1.414",
    "types-jmespath==1.1.0.20260724",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
docs = [
    "zensical==0.1.1",
]
