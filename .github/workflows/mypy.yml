---
name: "Mypy: Static Typing for Python"

"on":
    push:
        paths:
            - "**.py"
            - ".github/workflows/mypy.yml"
            - "uv.lock"
            - "pyproject.toml"
    pull_request:
        paths:
            - "**.py"
            - ".github/workflows/mypy.yml"
            - "uv.lock"
            - "pyproject.toml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    UV_MANAGED_PYTHON: "true"
    UV_LOCKED: "true"

jobs:
    mypy:
        if: github.server_url == 'https://github.com' && github.repository == 'arpanrec/bitwarden-exporter'
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.13.7", "3.14.10", "3.15.2"]
        name: mypy
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install uv 0.13.7
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
              with:
                  version: "0.13.7"
                  python-version: "${{ matrix.python-version }}"
                  enable-cache: true
                  cache-suffix: python-${{ matrix.python-version }}
                  cache-dependency-glob: |
                      **/uv.lock

            - name: Install dependencies
              run: |+
                  uv run python --version
                  uv sync --extra dev
              env:
                  UV_PYTHON: ${{ matrix.python-version }}

            - name: Analyzing the code with mypy
              run: uv run mypy $(git ls-files '*.py')
              env:
                  UV_PYTHON: ${{ matrix.python-version }}
